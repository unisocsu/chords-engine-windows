name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_from_run_id:
        description: "Existing successful build workflow run ID to use for the release"
        required: false
        default: ""
      release_tag:
        description: "New release tag, for example v0.2.0"
        required: false
        default: "v0.2.0"
      release_description:
        description: "Release description in Markdown"
        required: false
        default: "גרסת Preview חדשה של ChordsEngine Windows."

# First public release trigger: [release-v0.1.0]

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.release_from_run_id == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hebrew-tiny
            model: ggml-tiny-q5_1.bin
            language: he
            size: "200000000"
            bundle_model: "1"
          - name: hebrew-base
            model: ggml-base-q5_1.bin
            language: he
            size: "300000000"
            bundle_model: "1"
          - name: hebrew-small
            model: ggml-small-q5_1.bin
            language: he
            size: "500000000"
            bundle_model: "1"
          - name: hebrew-medium
            model: ggml-medium-q5_0.bin
            language: he
            size: "539000000"
            bundle_model: "1"
          - name: english-tiny
            model: ggml-tiny.en-q5_1.bin
            language: en
            size: "200000000"
            bundle_model: "1"
          - name: english-base
            model: ggml-base.en-q5_1.bin
            language: en
            size: "300000000"
            bundle_model: "1"
          - name: english-small
            model: ggml-small.en-q5_1.bin
            language: en
            size: "500000000"
            bundle_model: "1"
          - name: english-medium
            model: ggml-medium.en-q5_0.bin
            language: en
            size: "539000000"
            bundle_model: "1"
          - name: nomodel
            model: ggml-medium-q5_0.bin
            language: he
            size: "539000000"
            bundle_model: "0"
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Prepare whisper.cpp and model
        env:
          CHORDS_MODEL: ${{ matrix.model }}
          CHORDS_MODEL_SIZE: ${{ matrix.size }}
          CHORDS_UI_LANG: ${{ matrix.language }}
          CHORDS_BUNDLE_MODEL: ${{ matrix.bundle_model }}
        run: python scripts/setup_vendor.py
      - name: Generate Windows icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE "build") | Out-Null
          $src = [System.Drawing.Image]::FromFile((Join-Path $env:GITHUB_WORKSPACE "icon.jpg"))
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.DrawImage($src, 0, 0, 256, 256)
          $g.Dispose()
          $src.Dispose()
          $icon = [System.Drawing.Icon]::FromHandle($bmp.GetHicon())
          $stream = [System.IO.File]::Create((Join-Path $env:GITHUB_WORKSPACE "build/icon.ico"))
          $icon.Save($stream)
          $stream.Dispose()
          $icon.Dispose()
          $bmp.Dispose()
          if (-not (Test-Path "build/icon.ico")) { throw "Failed to create build/icon.ico" }

      - name: Build EXE
        env:
          CHORDS_MODEL: ${{ matrix.model }}
          CHORDS_UI_LANG: ${{ matrix.language }}
          CHORDS_BUNDLE_MODEL: ${{ matrix.bundle_model }}
        run: python build_tools/build_exe.py
      - name: Verify PyInstaller output
        shell: pwsh
        run: |
          $app = "build/dist/ChordsApp/ChordsApp.exe"
          if (-not (Test-Path -LiteralPath $app)) { throw "PyInstaller output is missing: $app" }
          Get-Item -LiteralPath $app | Select-Object FullName, Length
      - name: Verify bundled Python runtime
        shell: pwsh
        run: |
          $root = "build/dist/ChordsApp"
          $app = Join-Path $root "ChordsApp.exe"
          if (-not (Test-Path -LiteralPath $app)) { throw "PyInstaller executable is missing: $app" }
          $pythonDll = Get-ChildItem -LiteralPath $root -Recurse -Filter "python311.dll" -File | Select-Object -First 1
          if ($null -eq $pythonDll) { throw "PyInstaller Python runtime is missing: python311.dll" }
          $internal = Join-Path $root "_internal"
          if (-not (Test-Path -LiteralPath $internal -PathType Container)) { Write-Warning "No _internal directory found; using legacy PyInstaller layout." }
          Write-Host "ChordsApp.exe:"
          Get-Item -LiteralPath $app | Select-Object FullName, Length
          Write-Host "python311.dll:"
          $pythonDll | Select-Object FullName, Length
          Write-Host "Runtime directory: $($pythonDll.DirectoryName)"
      - name: Rename EXE
        shell: pwsh
        run: Move-Item -LiteralPath "release/Chords.exe" -Destination "release/Chords-${{ matrix.name }}.exe" -Force
      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "release/Chords-${{ matrix.name }}.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "EXE was not created: $exe" }
          Get-Item -LiteralPath $exe | Select-Object FullName, Length
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Installer
        shell: pwsh
        env:
          CHORDS_INSTALLER_EXE: Chords-${{ matrix.name }}.exe
          CHORDS_INSTALLER_TARGET_EXE: Chords-${{ matrix.name }}.exe
          CHORDS_INSTALLER_VARIANT: ${{ matrix.name }}
          CHORDS_INSTALLER_OUTPUT: ChordsEngine-${{ matrix.name }}-Installer
          CHORDS_INSTALLER_MODE: full
          CHORDS_APP_VERSION: "0.2.0"
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "installer\ChordsEngine.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "release\ChordsEngine-${{ matrix.name }}-Installer.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer was not created: $installer" }
          Get-Item -LiteralPath $installer | Select-Object FullName, Length

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Chords-Windows-${{ matrix.name }}-Installer
          path: release/ChordsEngine-${{ matrix.name }}-Installer.exe
          if-no-files-found: error
          retention-days: 14

      - name: Build lightweight Update EXE
        shell: pwsh
        env:
          CHORDS_MODEL: ${{ matrix.model }}
          CHORDS_UI_LANG: ${{ matrix.language }}
          CHORDS_BUNDLE_MODEL: "0"
        run: |
          python build_tools/build_exe.py --skip-pyi
          Move-Item -LiteralPath "release/Chords.exe" -Destination "release/Chords-${{ matrix.name }}-update.exe" -Force
          if (-not (Test-Path -LiteralPath "release/Chords-${{ matrix.name }}-update.exe")) { throw "Update EXE was not created" }

      - name: Build lightweight Update Installer
        shell: pwsh
        env:
          CHORDS_INSTALLER_EXE: Chords-${{ matrix.name }}-update.exe
          CHORDS_INSTALLER_TARGET_EXE: Chords-${{ matrix.name }}.exe
          CHORDS_INSTALLER_VARIANT: ${{ matrix.name }}
          CHORDS_INSTALLER_OUTPUT: ChordsEngine-${{ matrix.name }}-Update
          CHORDS_INSTALLER_MODE: update
          CHORDS_APP_VERSION: "0.2.0"
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "installer\ChordsEngine.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "release\ChordsEngine-${{ matrix.name }}-Update.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Update installer was not created: $installer" }
          Get-Item -LiteralPath $installer | Select-Object FullName, Length

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Chords-Windows-${{ matrix.name }}
          path: release/Chords-${{ matrix.name }}.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Update Installer
        uses: actions/upload-artifact@v4
        with:
          name: Chords-Windows-${{ matrix.name }}-Update
          path: release/ChordsEngine-${{ matrix.name }}-Update.exe
          if-no-files-found: error
          retention-days: 14


  release:
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_from_run_id != '')) }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Tiny
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-hebrew-tiny
          path: release
          run-id: ${{ inputs.release_from_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download Base
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-hebrew-base
          path: release
          run-id: ${{ inputs.release_from_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download Small
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-hebrew-small
          path: release
          run-id: ${{ inputs.release_from_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download English Tiny
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-english-tiny
          path: release
          run-id: ${{ inputs.release_from_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download English Base
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-english-base
          path: release
          run-id: ${{ inputs.release_from_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download English Small
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-english-small
          path: release
          run-id: ${{ inputs.release_from_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download English Medium
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-english-medium
          path: release
          run-id: ${{ inputs.release_from_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download No Model
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-nomodel
          path: release
          run-id: ${{ inputs.release_from_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download English Model
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-english-medium
          path: release
          run-id: ${{ inputs.release_from_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download Medium
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-hebrew-medium
          path: release
          run-id: ${{ inputs.release_from_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download Tiny Installer
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-hebrew-tiny-Installer
          path: release
          run-id: ${{ inputs.release_from_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download Base Installer
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-hebrew-base-Installer
          path: release
          run-id: ${{ inputs.release_from_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download Small Installer
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-hebrew-small-Installer
          path: release
          run-id: ${{ inputs.release_from_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download English Model Installer
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-english-medium-Installer
          path: release
          run-id: ${{ inputs.release_from_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download Medium Installer
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-hebrew-medium-Installer
          path: release
          run-id: ${{ inputs.release_from_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download No Model Installer
        uses: actions/download-artifact@v4
        with:
          name: Chords-Windows-nomodel-Installer
          path: release
          run-id: ${{ inputs.release_from_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf "%s\\n" "${{ inputs.release_description }}" > release-notes.md
          set -e
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace it."
            exit 1
          fi

          echo "Publishing release ${TAG} for commit ${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --tags --force
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"

          gh release create "${TAG}" release/*.exe --title "ChordsEngine ${TAG}" --notes-file release-notes.md
